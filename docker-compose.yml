services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auction_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auction_frontend
    ports:
      - "8501:80"
    depends_on:
      - backend
    restart: always
