version: '3.8'

services:
  # Application web Streamlit
  web:
    build: .
    container_name: wow-housing-web
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data          # Base de données persistante
      - ./.env:/app/.env:ro       # Variables d'environnement
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - scheduler

  # Service de scan automatique
  scheduler:
    build: .
    container_name: wow-housing-scheduler
    volumes:
      - ./data:/app/data          # Même base de données que web
      - ./.env:/app/.env:ro       # Variables d'environnement
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    command: python scheduler.py

volumes:
  data:
